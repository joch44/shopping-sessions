[package]
name = "pipeline"
version = "0.1.0"
edition = "2024"
description = "Shopping Sessions pipeline"
publish = false

[dependencies]
memchr = "2.8.3"
memmap2 = "0.9.12"
parquet = { version = "60.1.0", default-features = false }
rustc-hash = "2.1.3"
serde_json = "1.0.154"
xxhash-rust = { version = "0.8.21", features = ["xxh3"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

# Same code generation as release, with symbols, for perf.
[profile.profiling]
inherits = "release"
debug = true
