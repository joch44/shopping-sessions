[package]
name = "pipeline"
version = "0.1.0"
edition = "2024"
description = "Shopping Sessions pipeline"
publish = false

[dependencies]
parquet = { version = "60.1.0", default-features = false }
rustc-hash = "2.1.3"
serde_json = "1.0.154"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
