[package]
name = "parsegate"
version = "0.1.0"
edition = "2024"
publish = false

# Parse gate: the live pipeline's csv/key/ts fast paths vs a frozen v1 reference.
# Run via research/gate/run_gate.sh (copies pipeline/src/{csv,key,ts}.rs into src/live/).
[dependencies]
memchr = "2.8.3"
memmap2 = "0.9.12"
rustc-hash = "2.1.3"
xxhash-rust = { version = "0.8.21", features = ["xxh3"] }

[profile.release]
opt-level = 3
debug-assertions = true
overflow-checks = true
panic = "abort"
